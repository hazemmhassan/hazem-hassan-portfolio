<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
  <title id="title">OpsHub request workflow</title>
  <desc id="description">A bilingual request moves through staff review, a recorded decision, and reliable automated delivery.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#092f2a"/>
      <stop offset="1" stop-color="#173b32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001815" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1200" height="750" rx="38" fill="url(#background)"/>
  <g fill="#ffb347">
    <rect x="72" y="62" width="46" height="46" rx="13"/>
    <circle cx="88" cy="78" r="5" fill="#08312b"/>
    <circle cx="103" cy="78" r="5" fill="#08312b"/>
    <circle cx="88" cy="93" r="5" fill="#08312b"/>
    <circle cx="103" cy="93" r="5" fill="#08312b"/>
  </g>
  <text x="134" y="95" fill="#ffffff" font-family="Arial, sans-serif" font-size="29" font-weight="700">OpsHub</text>
  <text x="74" y="190" fill="#9ee0cc" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">ARABIC AND ENGLISH WORKFLOWS</text>
  <text x="72" y="267" fill="#ffffff" font-family="Arial, sans-serif" font-size="57" font-weight="700">Every request.</text>
  <text x="72" y="335" fill="#ffffff" font-family="Arial, sans-serif" font-size="57" font-weight="700">One clear path.</text>
  <text x="74" y="398" fill="#bed5cf" font-family="Arial, sans-serif" font-size="22">Structured intake, human approval,</text>
  <text x="74" y="432" fill="#bed5cf" font-family="Arial, sans-serif" font-size="22">and reliable automation delivery.</text>
  <rect x="74" y="490" width="204" height="58" rx="14" fill="#ffb347"/>
  <text x="102" y="527" fill="#082e29" font-family="Arial, sans-serif" font-size="20" font-weight="700">Request intake</text>
  <text x="74" y="646" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">RTL + LTR</text>
  <text x="190" y="646" fill="#88afa4" font-family="Arial, sans-serif" font-size="18">•</text>
  <text x="222" y="646" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">AUDIT HISTORY</text>
  <text x="380" y="646" fill="#88afa4" font-family="Arial, sans-serif" font-size="18">•</text>
  <text x="412" y="646" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">SAFE RETRIES</text>
  <g filter="url(#shadow)">
    <rect x="667" y="128" width="456" height="500" rx="30" fill="#234b43" stroke="#4c7069" stroke-width="2"/>
    <circle cx="718" cy="182" r="10" fill="#9ee0cc"/>
    <text x="744" y="190" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Request 7HK4P9Q2</text>
    <line x1="710" y1="222" x2="1080" y2="222" stroke="#52736d" stroke-width="2"/>
    <g font-family="Arial, sans-serif" font-size="19">
      <rect x="711" y="260" width="44" height="44" rx="11" fill="#315c53" stroke="#5f827a"/>
      <text x="727" y="290" fill="#d9e8e4">1</text>
      <text x="786" y="290" fill="#d9e8e4">Request received</text>
      <circle cx="1067" cy="281" r="6" fill="#9ee0cc"/>
      <rect x="711" y="337" width="44" height="44" rx="11" fill="#315c53" stroke="#5f827a"/>
      <text x="727" y="367" fill="#d9e8e4">2</text>
      <text x="786" y="367" fill="#d9e8e4">Review started</text>
      <circle cx="1067" cy="358" r="6" fill="#9ee0cc"/>
      <rect x="711" y="414" width="44" height="44" rx="11" fill="#315c53" stroke="#5f827a"/>
      <text x="727" y="444" fill="#d9e8e4">3</text>
      <text x="786" y="444" fill="#d9e8e4">Decision recorded</text>
      <circle cx="1067" cy="435" r="6" fill="#9ee0cc"/>
      <rect x="695" y="491" width="400" height="78" rx="16" fill="#41695f"/>
      <rect x="711" y="508" width="44" height="44" rx="11" fill="#c8f6dd"/>
      <text x="727" y="538" fill="#143b33">4</text>
      <text x="786" y="538" fill="#ffffff" font-weight="700">Delivery confirmed</text>
      <circle cx="1067" cy="529" r="7" fill="#ffffff"/>
    </g>
  </g>
</svg>
